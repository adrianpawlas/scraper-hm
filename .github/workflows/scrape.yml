name: H&M Scraper

on:
  schedule:
    - cron: '15 7 * * 0,2,5'  # Sunday, Tuesday, Friday at 7:15 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no DB writes)'
        required: false
        default: 'false'
        type: boolean
      shards:
        description: 'Number of parallel shards'
        required: false
        default: '8'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      total_products: ${{ steps.count.outputs.total }}
    concurrency:
      group: scraper-hm-scrape
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape all products
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p logs artifacts
          python -c "
          import asyncio, pickle, os, sys
          sys.path.insert(0, '.')
          from scraper import scrape_all_categories
          products = asyncio.run(scrape_all_categories())
          with open('artifacts/products.pkl', 'wb') as f:
              pickle.dump(products, f, protocol=pickle.HIGHEST_PROTOCOL)
          print(f'Scraped {len(products)} unique products')
          # Write count to GITHUB_OUTPUT
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'total={len(products)}')
          "

      - name: Upload products artifact
        uses: actions/upload-artifact@v4
        with:
          name: products
          path: artifacts/products.pkl
          retention-days: 1

  embed:
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    concurrency:
      group: scraper-hm-embed-${{ matrix.shard }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download products artifact
        uses: actions/download-artifact@v4
        with:
          name: products
          path: artifacts/

      - name: Run scraper (shard ${{ matrix.shard }}/8)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p logs
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS --from-file artifacts/products.pkl --shard ${{ matrix.shard }}/8

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-shard-${{ matrix.shard }}
          path: logs/
          retention-days: 7
